site_name: Skorcast Docs
site_description: Dokumentasi project Skorcast — apa yang dibuat dan kenapa.
site_url: https://docs.skorcast.online

# Repo (edit link di tiap halaman)
repo_url: https://github.com/ahmadzaenimubarok/docs-skorcast
repo_name: ahmadzaenimubarok/docs-skorcast
edit_uri: edit/main/docs

# Ganti dengan repo kamu nanti (saat repo docs-skorcast sudah dibuat)
# repo_url: https://github.com/ahmadzaenimubarok/docs-skorcast
# repo_name: ahmadzaenimubarok/docs-skorcast
# edit_uri: edit/main/docs

theme:
  name: material
  font: false
  palette:
    - scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  language: id

plugins:
  - search

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true

nav:
  - Beranda: index.md
  - Agentic AI:
      - LangGraph: langgraph.md
      - Setup Agentic AI (POC): agentic-setup.md
